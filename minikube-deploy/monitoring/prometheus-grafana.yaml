apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'venuego-services'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service:6235']
            labels: { service: 'auth-service' }
          - targets: ['user-service:6238']
            labels: { service: 'user-service' }
          - targets: ['venue-service:6236']
            labels: { service: 'venue-service' }
          - targets: ['ticketing-service:6240']
            labels: { service: 'ticketing-service' }
          - targets: ['checkin-service:6237']
            labels: { service: 'checkin-service' }
          - targets: ['order-service:6239']
            labels: { service: 'order-service' }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.44.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: venuego
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-venuego
  labels:
    app: grafana
data:
  venuego.json: |
    {
      "id": null,
      "uid": "venuego-overview",
      "title": "VenueGo Services",
      "tags": ["venuego"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "current": { "value": "$__all", "text": "All" },
            "options": [
              { "value": "$__all", "text": "All", "selected": true },
              { "value": "auth-service", "text": "auth-service", "selected": false },
              { "value": "user-service", "text": "user-service", "selected": false },
              { "value": "venue-service", "text": "venue-service", "selected": false },
              { "value": "ticketing-service", "text": "ticketing-service", "selected": false },
              { "value": "checkin-service", "text": "checkin-service", "selected": false },
              { "value": "order-service", "text": "order-service", "selected": false }
            ],
            "includeAll": true,
            "multi": true,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "HTTP Traffic",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count[1m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP Error Rate (4xx+5xx req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{status=~\"4..|5..\"}[1m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Request Latency p99 (seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket[1m])))",
              "legendFormat": "p99 {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Request Latency p50 (seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_server_requests_seconds_bucket[1m])))",
              "legendFormat": "p50 {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Database",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "DB Query Rate by Operation (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (operation) (rate(db_query_timer_seconds_count[1m]))",
              "legendFormat": "{{operation}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "DB Query Latency p99 by Operation (seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (operation, le) (rate(db_query_timer_seconds_bucket[1m])))",
              "legendFormat": "p99 {{operation}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "row",
          "title": "JVM",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "collapsed": false
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "JVM Heap Used (bytes)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "{{service}} heap",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "JVM GC Pause Rate (pauses/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "lineWidth": 2 }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (service) (rate(jvm_gc_pause_seconds_count[1m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:9.5.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-venuego

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
