server:
  port: 6236

spring:
  application:
    name: venuego.venue
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/venuego?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 4445566
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

  flyway:
    enabled: false

  cache:
    type: caffeine
    cache-names: venueById,venuesPage
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

grpc:
  server:
    port: 9090
  client:
    inventory-service:
      address: static://localhost:9240
      negotiationType: plaintext

ticketing:
  grpc:
    retry:
      max-attempts: 3
      delay-ms: 300

rocketmq:
  name-server: localhost:9876

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    com.happy.VenueService.service.impl: DEBUG
    com.happy.VenueService.config: DEBUG

bloom-filter:
  venue:
    name: "venue:bloom:filter"          
    expected-insertions: 1000000        
    false-probability: 0.03

venue:
  cache:
    enabled: true
    level: L2