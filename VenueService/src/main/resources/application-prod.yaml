server:
  port: 6236

spring:
  application:
    name: venuego.venue
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  flyway:
    enabled: false

  cache:
    type: caffeine
    cache-names: venueById,venuesPage
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

grpc:
  server:
    port: 9090
  client:
    inventory-service:
      address: static://ticketing-service:9240
      negotiationType: plaintext

ticketing:
  grpc:
    retry:
      max-attempts: 3
      delay-ms: 300

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    # com.happy.VenueService.service.impl: DEBUG

bloom-filter:
  venue:
    name: "venue:bloom:filter"
    expected-insertions: 1000000
    false-probability: 0.03

venue:
  cache:
    enabled: true
    level: L2
